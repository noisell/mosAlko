version: "3.9"

services:
  redis:
    image: redis:6
    container_name: redis_app
    command: --port 6380
    restart: always
    expose:
      - 6380
    networks:
      - main

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: bot
    env_file:
      - .env-prod
    command: ["python", "-m", "bot.main"]
    networks:
      - main

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    env_file:
      - .env-prod
    depends_on:
      - redis
    ports:
      - "8000:8000"
    command: ["/start.sh"]
    networks:
      - main

networks:
  main: